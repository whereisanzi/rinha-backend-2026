[workspace]
resolver = "2"
members = [
    "crates/lb",
    "crates/api",
    "crates/build-index",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
rust-version = "1.83"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = 0
overflow-checks = false
incremental = false

[profile.release.package."*"]
opt-level = 3
