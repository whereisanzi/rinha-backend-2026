services:
  lb:
    image: rinha-lb:latest
    build:
      context: .
      dockerfile: Dockerfile.lb
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - UPSTREAMS=/sockets/api1.sock,/sockets/api2.sock
      - BUF_SIZE=4096
      - BACKLOG=4096
      - HEALTH_PATH=/ready
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    networks:
      - rinha-net
    security_opt:
      - seccomp=unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.16"
          memory: "30M"

  init:
    image: rinha-index:latest
    build:
      context: .
      dockerfile: Dockerfile.index
    volumes:
      - resources:/resources
    networks:
      - rinha-net
    security_opt:
      - seccomp=unconfined
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30M"

  api1:
    image: rinha-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - INDEX_PATH=/resources/index.bin
      - UDS_PATH=/sockets/api1.sock
      - UDS_MODE=438
      - NPROBE=1
      - BACKLOG=4096
    volumes:
      - sockets:/sockets
      - resources:/resources:ro
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - rinha-net
    security_opt:
      - seccomp=unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.37"
          memory: "145M"

  api2:
    image: rinha-api:latest
    environment:
      - INDEX_PATH=/resources/index.bin
      - UDS_PATH=/sockets/api2.sock
      - UDS_MODE=438
      - NPROBE=1
      - BACKLOG=4096
    volumes:
      - sockets:/sockets
      - resources:/resources:ro
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - rinha-net
    security_opt:
      - seccomp=unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.37"
          memory: "145M"

volumes:
  sockets:
  resources:

networks:
  rinha-net:
    driver: bridge
