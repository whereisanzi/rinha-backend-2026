services:
  lb:
    image: rinha-lb:latest
    build:
      context: .
      dockerfile: Dockerfile.lb
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - UPSTREAMS=/sockets/api1.sock,/sockets/api2.sock
      - BUF_SIZE=4096
      - BACKLOG=4096
      - HEALTH_PATH=/ready
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    networks:
      - rinha-net
    security_opt:
      - seccomp=unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.16"
          memory: "30M"

  api1:
    image: rinha-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - INDEX_PATH=/resources/index.bin
      - UDS_PATH=/sockets/api1.sock
      - UDS_MODE=438
      - NPROBE=1
      - BACKLOG=4096
      - RINHA_CPU=0
      - SEARCH=${SEARCH:-0}
      - SCHED=${SCHED:-fifo}
      - FAST_NPROBE=${FAST_NPROBE:-4}
    volumes:
      - sockets:/sockets
    networks:
      - rinha-net
    security_opt:
      - seccomp=unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
      rtprio: 99
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "160M"

  api2:
    image: rinha-api:latest
    environment:
      - INDEX_PATH=/resources/index.bin
      - UDS_PATH=/sockets/api2.sock
      - UDS_MODE=438
      - NPROBE=1
      - BACKLOG=4096
      - RINHA_CPU=2
      - SEARCH=${SEARCH:-0}
      - SCHED=${SCHED:-fifo}
      - FAST_NPROBE=${FAST_NPROBE:-4}
    volumes:
      - sockets:/sockets
    networks:
      - rinha-net
    security_opt:
      - seccomp=unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
      rtprio: 99
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "160M"
    depends_on:
      - api1

volumes:
  sockets:

networks:
  rinha-net:
    driver: bridge
